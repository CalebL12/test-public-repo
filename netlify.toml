# Aspirean Wealth — Netlify configuration.
# Static site, no build step; publish directory is this folder
# (repo root; Base directory in Netlify must be empty).

[build]
  publish = "."

# Security headers on every response. Scripts are fully locked to this
# domain (no inline scripts exist in the codebase); inline styles remain
# allowed, which is standard for styled static sites.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; font-src 'self'; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; frame-src https://www.google.com; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Long-cache immutable assets (fonts, images, vendored JS).
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images: cached for a year. Discipline this relies on: when an image
# is REPLACED, give it a new filename (photo-x-1400-v2.webp) and update
# the HTML - never overwrite an image in place, or visitors keep the
# old one for up to a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS and JS: cached for a year. Every HTML reference carries a version
# query (styles.css?v=YYYYMMDD). When css/js changes, bump the version
# in the HTML and browsers fetch fresh immediately; HTML itself is
# never long-cached, so the bump propagates on the next page load.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
